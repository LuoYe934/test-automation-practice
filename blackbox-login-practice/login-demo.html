<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户登录 - 演示系统</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background: #eef1f5; margin: 0; padding: 40px 0; }
  .card { width: 360px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 32px 36px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  h2 { text-align: center; color: #333; margin-top: 0; }
  label { display: block; font-size: 13px; color: #555; margin: 14px 0 6px; }
  input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  .captcha-row { display: flex; gap: 8px; align-items: center; }
  #captchaBox { width: 96px; height: 38px; background: #f0ead6; border-radius: 6px; text-align: center; line-height: 38px; font-size: 20px; font-family: Georgia, serif; letter-spacing: 4px; color: #5a4a2f; user-select: none; }
  #refreshBtn { font-size: 12px; color: #2b6cb0; background: none; border: none; cursor: pointer; padding: 4px; }
  button#loginBtn { width: 100%; margin-top: 22px; padding: 11px; background: #2b6cb0; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
  button#loginBtn:hover { background: #245a94; }
  #msg { margin-top: 14px; font-size: 13px; min-height: 18px; color: #c0392b; word-break: break-all; }
  #success { display: none; text-align: center; color: #276749; font-size: 16px; padding: 10px 0; }
  .hint { font-size: 12px; color: #999; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<div class="card" id="loginCard">
  <h2>用户登录</h2>
  <label for="username">用户名（6-18位，字母开头）</label>
  <input type="text" id="username" autocomplete="off">
  <label for="captcha">验证码</label>
  <div class="captcha-row">
    <input type="text" id="captcha" maxlength="4" autocomplete="off" style="flex:1">
    <div id="captchaBox"></div>
    <button id="refreshBtn" type="button">刷新</button>
  </div>
  <label for="password">密码（8-20位，区分大小写）</label>
  <input type="text" id="password" autocomplete="off">
  <button id="loginBtn" type="button">登 录</button>
  <div id="msg"></div>
  <div class="hint">演示环境 · 数据仅存内存 · 刷新即重置</div>
</div>
<div class="card" id="success">
  <h2>🎉</h2>
  <p id="welcome"></p>
</div>
<script>
var VALID_USER = "tester01";
var VALID_PWD = "Abc@1234";
var CHARS = "ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
var failCount = 0;
var lockedUntil = 0;
var captchaText = "";
var captchaBornAt = 0;

function genCaptcha() {
  var s = "";
  for (var i = 0; i < 4; i++) {
    s += CHARS.charAt(Math.floor(Math.random() * CHARS.length));
  }
  captchaText = s;
  captchaBornAt = Date.now();
  document.getElementById("captchaBox").textContent = s;
}

function showMsg(htmlText) {
  var el = document.getElementById("msg");
  el.innerHTML = htmlText;
}

function login() {
  var user = document.getElementById("username").value;
  var pwd = document.getElementById("password").value;
  var cap = document.getElementById("captcha").value;
  var now = Date.now();

  if (user === "") { showMsg("用户名不能为空"); return; }
  if (!/^[A-Za-z]/.test(user)) { showMsg("用户名须以字母开头：" + user); return; }
  if (user.length < 5 || user.length > 18) { showMsg("用户名须6-18位"); return; }
  if (/[^A-Za-z0-9_]/.test(user)) { showMsg("用户名仅可含字母、数字、下划线"); return; }
  if (pwd === "") { showMsg("密码不能为空"); return; }
  if (pwd.length < 7 || pwd.length > 20) { showMsg("密码须8-20位"); return; }

  if (now < lockedUntil) {
    showMsg("账号已锁定，请 " + Math.ceil((lockedUntil - now) / 1000) + " 秒后再试");
    return;
  }

  if (user !== VALID_USER) {
    failCount++;
    showMsg("该用户不存在：" + user);
    checkLock();
    return;
  }

  if (pwd.toLowerCase() !== VALID_PWD.toLowerCase()) {
    failCount++;
    showMsg("密码错误");
    checkLock();
    return;
  }

  if (cap === "") {
    showMsg("欢迎回来，" + user + "！");
    success();
    return;
  }
  if (cap !== captchaText) {
    failCount++;
    showMsg("验证码错误");
    checkLock();
    return;
  }
  if (now - captchaBornAt > 120000) {
    failCount++;
    showMsg("验证码已过期，请刷新后重试");
    checkLock();
    return;
  }

  success();
}

function checkLock() {
  if (failCount > 5) {
    lockedUntil = Date.now() + 60000;
    showMsg("连续错误超过5次，账号已锁定1分钟");
  }
}

function success() {
  document.getElementById("loginCard").style.display = "none";
  var s = document.getElementById("success");
  document.getElementById("welcome").textContent = "登录成功，欢迎回来 tester01";
  s.style.display = "block";
}

document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("refreshBtn").addEventListener("click", genCaptcha);
genCaptcha();
</script>
</body>
</html>
