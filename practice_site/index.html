<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>商品中心 · Selenium 练习靶场</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f4f6f9; color: #1f2937; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px; }
  .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  h1 { font-size: 20px; margin: 0 0 16px; }
  label { display: block; font-size: 13px; margin: 12px 0 6px; color: #4b5563; }
  input, select, button { font-size: 14px; padding: 9px 12px; border-radius: 8px; border: 1px solid #d1d5db; }
  input:focus, select:focus { outline: 2px solid #2563eb33; border-color: #2563eb; }
  button { background: #2563eb; color: #fff; border: none; cursor: pointer; font-weight: 600; }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #e5e7eb; color: #374151; }
  button.secondary:hover { background: #d1d5db; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #error-msg { color: #dc2626; font-size: 13px; min-height: 20px; margin-top: 8px; }
  #success-msg { color: #16a34a; font-size: 13px; min-height: 20px; margin-top: 8px; }
  .hidden { display: none !important; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 18px; }
  .product-card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; background: #fafafa; }
  .product-card h3 { margin: 0 0 6px; font-size: 15px; }
  .price { color: #dc2626; font-weight: 700; }
  .meta { font-size: 12px; color: #6b7280; margin-top: 4px; }
  .sold-out { color: #9ca3af; }
  header.bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  #cart-count { background: #dc2626; color: #fff; border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  iframe { width: 100%; height: 220px; border: 1px solid #d1d5db; border-radius: 8px; margin-top: 12px; }
  .tip { font-size: 12px; color: #6b7280; margin-top: 14px; line-height: 1.8; background: #f9fafb; padding: 10px 12px; border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 登录页 -->
  <div id="login-section" class="card">
    <h1>用户登录</h1>
    <label for="username">用户名</label>
    <input id="username" name="username" type="text" placeholder="admin">
    <label for="password">密码</label>
    <input id="password" name="password" type="password" placeholder="123456">
    <div style="margin-top:16px">
      <button id="login-btn" type="button">登 录</button>
    </div>
    <div id="error-msg"></div>
    <div id="success-msg"></div>
    <div class="tip">
      正确账号：<b>admin / 123456</b>、<b>tester / test123</b><br>
      元素 id：username、password、login-btn、error-msg、success-msg
    </div>
  </div>

  <!-- 主页面 -->
  <div id="app-section" class="card hidden">
    <header class="bar">
      <h1 style="margin:0">商品中心</h1>
      <div class="row">
        <span>购物车 <span id="cart-count">0</span></span>
        <button id="logout-btn" class="secondary" type="button">退出</button>
      </div>
    </header>

    <div class="row">
      <input id="search-input" type="text" placeholder="输入关键词，如 键盘">
      <button id="search-btn" type="button">搜索</button>
      <select id="category-select">
        <option value="">全部分类</option>
        <option value="外设">外设</option>
        <option value="显示">显示</option>
        <option value="配件">配件</option>
        <option value="音频">音频</option>
        <option value="家具">家具</option>
      </select>
    </div>

    <div id="result-count" class="meta" style="margin-top:10px"></div>
    <div id="product-list" class="grid" data-render-id="0"></div>
    <div id="empty-tip" class="meta hidden" style="margin-top:14px">没有找到相关商品</div>

    <hr style="margin:24px 0;border:none;border-top:1px solid #e5e7eb">

    <!-- 动态加载：练显式等待 -->
    <div class="row">
      <button id="load-more-btn" class="secondary" type="button">加载库存信息</button>
      <span id="loading" class="meta hidden">加载中...</span>
      <span id="stock-info" class="meta hidden">库存同步完成：共 <b>6</b> 个商品</span>
    </div>

    <!-- 弹窗 / iframe：练切换 -->
    <div class="row" style="margin-top:14px">
      <button id="alert-btn" class="secondary" type="button">弹出提示框</button>
      <button id="confirm-btn" class="secondary" type="button">弹出确认框</button>
    </div>
    <iframe id="feedback-frame" title="feedback" src="/iframe.html"></iframe>

    <div class="tip">
      进阶元素：load-more-btn（点击后 2 秒出现 stock-info，练显式等待）、alert-btn / confirm-btn（练 Alert 切换）、feedback-frame（练 iframe 切换）
    </div>
  </div>

</div>

<script>
const $ = (s) => document.querySelector(s);
let token = "";

function renderProducts(items) {
  const list = $("#product-list");
  list.innerHTML = "";
  $("#empty-tip").classList.toggle("hidden", items.length > 0);
  $("#result-count").textContent = `共找到 ${items.length} 个商品`;
  items.forEach(p => {
    const div = document.createElement("div");
    div.className = "product-card";
    div.setAttribute("data-id", p.id);
    const out = p.stock === 0;
    div.innerHTML = `
      <h3>${p.name}</h3>
      <div class="price">¥${p.price}</div>
      <div class="meta">分类：${p.category} · 库存：${p.stock}</div>
      <div style="margin-top:10px">
        <button class="add-cart-btn" data-id="${p.id}" ${out ? "disabled" : ""}>
          ${out ? "已售罄" : "加入购物车"}
        </button>
      </div>`;
    list.appendChild(div);
  });
  // 渲染版本号：每次重绘 +1。
  // 这是前端为自动化测试留的「可测性钩子」，自动化脚本靠它判断列表是否刷新完毕。
  list.setAttribute("data-render-id", String(parseInt(list.getAttribute("data-render-id") || "0") + 1));
}

async function fetchProducts() {
  const q = $("#search-input").value.trim();
  const category = $("#category-select").value;
  let url = "/api/products?";
  if (q) url += "q=" + encodeURIComponent(q) + "&";
  if (category) url += "category=" + encodeURIComponent(category);
  const res = await fetch(url);
  const json = await res.json();
  renderProducts(json.data.items);
}

$("#login-btn").addEventListener("click", async () => {
  $("#error-msg").textContent = "";
  $("#success-msg").textContent = "";
  const res = await fetch("/api/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({username: $("#username").value, password: $("#password").value})
  });
  const json = await res.json();
  if (json.code === 0) {
    token = json.data.token;
    $("#success-msg").textContent = "登录成功，欢迎 " + json.data.username;
    setTimeout(() => {
      $("#login-section").classList.add("hidden");
      $("#app-section").classList.remove("hidden");
      fetchProducts();
    }, 300);
  } else {
    $("#error-msg").textContent = json.msg;
  }
});

$("#search-btn").addEventListener("click", fetchProducts);
$("#category-select").addEventListener("change", fetchProducts);

$("#product-list").addEventListener("click", (e) => {
  if (e.target.classList.contains("add-cart-btn")) {
    const n = parseInt($("#cart-count").textContent) + 1;
    $("#cart-count").textContent = n;
    e.target.textContent = "已加入";
    e.target.disabled = true;
  }
});

$("#load-more-btn").addEventListener("click", () => {
  $("#loading").classList.remove("hidden");
  $("#stock-info").classList.add("hidden");
  setTimeout(() => {
    $("#loading").classList.add("hidden");
    $("#stock-info").classList.remove("hidden");
  }, 2000);
});

$("#alert-btn").addEventListener("click", () => alert("操作成功"));
$("#confirm-btn").addEventListener("click", () => {
  if (confirm("确定要清空购物车吗？")) $("#cart-count").textContent = "0";
});
$("#logout-btn").addEventListener("click", () => location.reload());
</script>
</body>
</html>
